<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anzahl Zurrgurte - Bkf</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background: #ffffff;
            margin: 0;
            padding: 20px;
            font-family: 'Caveat', cursive;
            color: #222;
            font-size: 26px;
        }
        
        .blatt {
            width: 100%;
            max-width: 999px;
            margin: 0 auto;
            padding: 40px;
        }

        h2 {
            border-bottom: 3px solid #000;
            padding-bottom: 15px;
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 30px;
        }

        /* Obarvane in KREPKE spremenljivke */
        .var-m { color: #0056b3; font-weight: bold; font-size: 28px; } /* Masse */
        .var-mu { color: #28a745; font-weight: bold; font-size: 28px; } /* Reibbeiwert */
        .var-stf { color: #e67e22; font-weight: bold; font-size: 28px; } /* Vorspannkraft */
        .var-res { color: #d63031; font-weight: bold; font-size: 32px; } /* Ergebnis */

        .formel-box {
            padding: 25px;
            border: 2px solid #ddd;
            background-color: #fafafa;
            margin-bottom: 40px;
            border-radius: 10px;
            font-size: 26px;
            line-height: 1.6;
        }

        .calc-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            font-size: 26px;
        }

        input {
            border: none;
            border-bottom: 2px solid #000;
            background: transparent;
            width: 120px;
            font-family: 'Caveat', cursive;
            font-size: 26px;
            text-align: center;
            font-weight: bold;
            color: #000;
        }
        
        button {
            background: #f0f0f0;
            border: 1px solid #333;
            padding: 8px 20px;
            cursor: pointer;
            font-family: 'Caveat', cursive;
            font-size: 22px;
            border-radius: 8px;
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-top: 2px solid #333;
        }
    </style>
</head>
<body>

<div class="blatt">
    <h2>Berechnung: Anzahl der Zurrgurte</h2>
    
    <div class="formel-box">
        <strong>Grundformel (Niederzurren):</strong><br>
        <span class="var-res">n</span> = (<span class="var-m">m</span> * 10 * (0.8 - <span class="var-mu">μ</span>)) / (2 * <span class="var-stf">STF</span> * <span class="var-mu">μ</span>)
    </div>
    
    <div class="calc-row">
        <strong>1. Masse des Ladeguts (<span class="var-m">m</span>) [kg]:</strong>
        <input type="number" id="masse" value="2000">
    </div>
    
    <div class="calc-row">
        <strong>2. Reibbeiwert (<span class="var-mu">μ</span>) [0.1 - 0.6]:</strong>
        <input type="number" id="mu" value="0.3" step="0.05">
    </div>

    <div class="calc-row">
        <strong>3. Vorspannkraft (<span class="var-stf">STF</span>) [daN]:</strong>
        <input type="number" id="stf" value="300">
    </div>

    <div class="calc-row">
        <button onclick="berechneGurte()">Anzahl berechnen</button>
    </div>

    <div class="result-box">
        <strong>Ergebnis:</strong><br>
        Benötigte Anzahl der Gurte (<span class="var-res">n</span>): <span class="var-res" id="res_gurte">...</span> Stück
    </div>
</div>

<script>
    function berechneGurte() {
        const m = parseFloat(document.getElementById('masse').value);
        const mu = parseFloat(document.getElementById('mu').value);
        const stf = parseFloat(document.getElementById('stf').value);
        
        // n = (m * 10 * (0.8 - mu)) / (2 * STF * sin(alpha) * mu)
        // Predpostavka: kot 90 stopinj (sin 90 = 1) in 2-stransko napenjanje
        
        const n = (m * 10 * (0.8 - mu)) / (2 * stf * mu);
        
        document.getElementById('res_gurte').innerText = Math.ceil(n);
    }
</script>

</body>
</html>
