<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brutto-Netto-Rechner - Bkf</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            background: #ffffff;
            margin: 0;
            padding: 20px;
            font-family: 'Caveat', cursive;
            color: #222;
            font-size: 26px;
        }
        
        .blatt {
            width: 100%;
            max-width: 999px;
            margin: 0 auto;
            padding: 40px;
        }

        h2 {
            border-bottom: 3px solid #000;
            padding-bottom: 15px;
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 30px;
        }

        /* Povečane, obarvane in KREPKE (bold) spremenljivke */
        .var-b { color: #0056b3; font-weight: bold; font-size: 28px; } /* Brutto (B) */
        .var-t { color: #e67e22; font-weight: bold; font-size: 28px; } /* Tara (T) */
        .var-n { color: #28a745; font-weight: bold; font-size: 28px; } /* Netto (N) */

        .formel-box {
            padding: 25px;
            border: 2px solid #ddd;
            background-color: #fafafa;
            margin-bottom: 40px;
            border-radius: 10px;
            font-size: 26px;
            line-height: 1.6;
        }

        .calc-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            font-size: 26px;
        }

        input {
            border: none;
            border-bottom: 2px solid #000;
            background: transparent;
            width: 150px;
            font-family: 'Caveat', cursive;
            font-size: 26px;
            text-align: center;
            font-weight: bold;
            color: #000;
        }
        
        button {
            background: #f0f0f0;
            border: 1px solid #333;
            padding: 8px 20px;
            cursor: pointer;
            font-family: 'Caveat', cursive;
            font-size: 22px;
            border-radius: 8px;
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-top: 2px solid #333;
        }
    </style>
</head>
<body>

<div class="blatt">
    <h2>Berechnung: Brutto-Netto</h2>
    
    <div class="formel-box">
        <strong>Formeln:</strong><br>
        <span class="var-n">N</span> (Netto) = <span class="var-b">B</span> (Brutto) - <span class="var-t">T</span> (Tara)<br>
        <span class="var-b">B</span> (Brutto) = <span class="var-n">N</span> (Netto) + <span class="var-t">T</span> (Tara)
    </div>
    
    <div class="calc-row">
        <strong>1. Bruttogewicht (<span class="var-b">B</span>) [kg]:</strong>
        <input type="number" id="brutto" value="40000">
    </div>
    
    <div class="calc-row">
        <strong>2. Taragewicht (<span class="var-t">T</span>) [kg]:</strong>
        <input type="number" id="tara" value="15000">
    </div>

    <div class="calc-row">
        <button onclick="calcNetto()">Nettogewicht berechnen</button>
    </div>

    <div class="result-box">
        <strong>Ergebnis:</strong><br>
        Nettogewicht / Nutzlast (<span class="var-n">N</span>): <span class="var-n" id="res_n">...</span> kg
    </div>
</div>

<script>
    function calcNetto() {
        const b = parseFloat(document.getElementById('brutto').value);
        const t = parseFloat(document.getElementById('tara').value);
        
        const n = b - t;
        
        document.getElementById('res_n').innerText = n.toLocaleString();
    }
</script>

</body>
</html>
